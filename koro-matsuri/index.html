<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07091c">
<title>弹珠祭典 · KORO MATSURI</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05060f;
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', 'Microsoft YaHei', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 80% at 50% 0%, #14183f 0%, #07091c 55%, #030409 100%);
  }
  #stage { position: relative; line-height: 0; }
  canvas {
    display: block;
    border-radius: 18px;
    box-shadow:
      0 0 0 2px #2a2f63,
      0 0 34px rgba(255, 140, 40, .18),
      0 22px 60px rgba(0, 0, 0, .75);
    image-rendering: auto;
  }
  #hint {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .08em; color: #6d749f; line-height: 1.4;
    text-align: center; pointer-events: none; white-space: pre;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    color: #cfd4ff; font-size: 13px; letter-spacing: .2em; background: #05060f; z-index: 9;
  }
  #boot.gone { display: none; }
  #err {
    position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 40%; overflow: auto;
    font: 11px/1.5 ui-monospace, Consolas, monospace; color: #ffb0b0; white-space: pre-wrap;
    background: rgba(30,0,10,.85); padding: 8px; border-radius: 8px; display: none; z-index: 10;
  }
  #testout {
    position: fixed; inset: 0; margin: 0; padding: 12px; overflow: auto; display: none;
    font: 11px/1.45 ui-monospace, Consolas, monospace; color: #b9ffd0; white-space: pre-wrap;
    background: #04060d; z-index: 11; text-align: left;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="450" height="800"></canvas><div id="hint"></div></div>
<div id="boot">読み込み中…</div>
<div id="err"></div>
<pre id="testout"></pre>
<script src="game.js"></script>
<script>
  // 引擎跑起来后由 game.js 移除 #boot；任何未捕获异常都显示在页面上，方便 file:// 下排查
  window.addEventListener('error', function (e) {
    var box = document.getElementById('err');
    box.style.display = 'block';
    box.textContent += (box.textContent ? '\n' : '') + (e.message || e.error) + '\n' +
      (e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : '');
  });
</script>
</body>
</html>
